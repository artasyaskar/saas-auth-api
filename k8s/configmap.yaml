apiVersion: v1
kind: ConfigMap
metadata:
  name: saas-auth-config
  namespace: saas-auth
  labels:
    app: saas-auth-api
    component: config
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
  DATABASE_POOL_SIZE: "20"
  DATABASE_MAX_OVERFLOW: "30"
  WORKERS: "4"
  MAX_REQUESTS: "1000"
  CORS_ORIGINS: "https://app.saas-auth.com,https://admin.saas-auth.com"
  FRONTEND_URL: "https://app.saas-auth.com"
  BASE_URL: "https://api.saas-auth.com"
  REDIS_HOST: "redis.saas-auth.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  DATABASE_HOST: "postgres.saas-auth.svc.cluster.local"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "saas_auth"
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  SMTP_TLS: "true"
  SMTP_FROM: "noreply@saas-auth.com"
  WEBHOOK_TIMEOUT: "30"
  WEBHOOK_MAX_RETRIES: "5"
  WEBHOOK_RETRY_DELAY: "5"
  RATE_LIMIT_REQUESTS: "1000"
  RATE_LIMIT_WINDOW: "3600"
  SESSION_TIMEOUT: "3600"
  TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  PASSWORD_MIN_LENGTH: "8"
  PASSWORD_REQUIRE_UPPERCASE: "true"
  PASSWORD_REQUIRE_LOWERCASE: "true"
  PASSWORD_REQUIRE_NUMBERS: "true"
  PASSWORD_REQUIRE_SYMBOLS: "true"
  MFA_ISSUER: "SaaS Auth"
  OAUTH_GOOGLE_ENABLED: "true"
  OAUTH_GITHUB_ENABLED: "true"
  OAUTH_MICROSOFT_ENABLED: "true"
  WEBHOOK_BATCH_SIZE: "100"
  WEBHOOK_WORKER_CONCURRENCY: "10"
  AUDIT_LOG_RETENTION_DAYS: "365"
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"
  HEALTH_CHECK_INTERVAL: "30"
  GRACEFUL_SHUTDOWN_TIMEOUT: "30"

---
