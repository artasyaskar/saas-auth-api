apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-auth-api
  namespace: saas-auth
  labels:
    app: saas-auth-api
    component: api
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.saas-auth.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
    nginx.ingress.kubernetes.io/cors-expose-headers: "Content-Length,Content-Range"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: "4"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/server-snippet: |
      more_set_headers "X-Frame-Options: DENY";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
      more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
      more_set_headers "Content-Security-Policy: default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'";
spec:
  tls:
  - hosts:
    - api.saas-auth.com
    - auth.saas-auth.com
    secretName: saas-auth-tls
  rules:
  - host: api.saas-auth.com
    http:
      paths:
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: saas-auth-api
            port:
              number: 80
      - path: /ready
        pathType: Prefix
        backend:
          service:
            name: saas-auth-api
            port:
              number: 80
      - path: /metrics
        pathType: Prefix
        backend:
          service:
            name: saas-auth-api
            port:
              number: 80
      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: saas-auth-api
            port:
              number: 80
      - path: /redoc
        pathType: Prefix
        backend:
          service:
            name: saas-auth-api
            port:
              number: 80
      - path: /openapi.json
        pathType: Prefix
        backend:
          service:
            name: saas-auth-api
            port:
              number: 80
      - path: /auth(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: saas-auth-api
            port:
              number: 80
      - path: /users(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: saas-auth-api
            port:
              number: 80
      - path: /admin(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: saas-auth-api
            port:
              number: 80
      - path: /api-keys(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: saas-auth-api
            port:
              number: 80
      - path: /webhooks(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: saas-auth-api
            port:
              number: 80
      - path: /organizations(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: saas-auth-api
            port:
              number: 80
      - path: /scim(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: saas-auth-api
            port:
              number: 80
      - path: /saml(/|$)(.*)
        pathType: Prefix
        backend:
          service:
            name: saas-auth-api
            port:
              number: 80
  - host: auth.saas-auth.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: saas-auth-api
            port:
              number: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saas-auth-api-staging
  namespace: saas-auth-staging
  labels:
    app: saas-auth-api
    component: api
    environment: staging
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-staging"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "*"
    nginx.ingress.kubernetes.io/cors-expose-headers: "*"
    nginx.ingress.kubernetes.io/cors-max-age: "86400"
    nginx.ingress.kubernetes.io/rate-limit: "50"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - api-staging.saas-auth.com
    secretName: saas-auth-tls-staging
  rules:
  - host: api-staging.saas-auth.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: saas-auth-api-staging
            port:
              number: 80
