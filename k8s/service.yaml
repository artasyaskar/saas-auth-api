apiVersion: v1
kind: Service
metadata:
  name: saas-auth-api
  namespace: saas-auth
  labels:
    app: saas-auth-api
    component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: https
    port: 443
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app: saas-auth-api

---
apiVersion: v1
kind: Service
metadata:
  name: saas-auth-api-staging
  namespace: saas-auth-staging
  labels:
    app: saas-auth-api
    component: api
    environment: staging
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  selector:
    app: saas-auth-api

---
apiVersion: v1
kind: Service
metadata:
  name: saas-auth-api-headless
  namespace: saas-auth
  labels:
    app: saas-auth-api
    component: api
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
  selector:
    app: saas-auth-api
